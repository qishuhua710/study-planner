<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- 渐变圆角背景，半径留足 maskable 安全区 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 日历顶部装订环 -->
  <rect x="184" y="128" width="14" height="44" rx="7" fill="#fff" opacity="0.95"/>
  <rect x="314" y="128" width="14" height="44" rx="7" fill="#fff" opacity="0.95"/>
  <!-- 日历主体 -->
  <rect x="136" y="156" width="240" height="224" rx="24" fill="#fff"/>
  <!-- 日历头部色条 -->
  <path d="M160 156 h192 a24 24 0 0 1 24 24 v28 h-240 v-28 a24 24 0 0 1 24-24 z" fill="#7C3AED" opacity="0.9"/>
  <!-- 日期网格点 4列x3行 -->
  <g fill="#4F46E5" opacity="0.22">
    <circle cx="180" cy="252" r="11"/>
    <circle cx="232" cy="252" r="11"/>
    <circle cx="284" cy="252" r="11"/>
    <circle cx="336" cy="252" r="11"/>
    <circle cx="180" cy="300" r="11"/>
    <circle cx="232" cy="300" r="11"/>
    <circle cx="284" cy="300" r="11"/>
    <circle cx="180" cy="348" r="11"/>
    <circle cx="232" cy="348" r="11"/>
  </g>
  <!-- 完成标记：绿色圆 + 白色对勾 -->
  <circle cx="336" cy="324" r="30" fill="#22C55E"/>
  <path d="M321 324 l11 11 l19 -23" stroke="#fff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
