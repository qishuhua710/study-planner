[package]
name = "study-planner"
version = "0.1.0"
description = "学习日程管理桌面版"
authors = ["study-planner"]
edition = "2021"

# 桌面 + 移动兼容的 lib 设置（移动端预留，桌面只编译 rlib 也会用到）
[lib]
name = "study_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
